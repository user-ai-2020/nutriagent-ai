# Build and push all 9 app images to Docker Hub on merge to main (Task 8.5).
# Does NOT run on pull_request — untested images must not be published.
# Requires GitHub Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (access token, not password).
# Setup: docs/DOCKER_HUB_SETUP.md

name: Docker Publish

on:
  push:
    branches:
      - main

# Only the newest run per branch matters — cancel superseded ones instead of
# letting them queue and burn Actions minutes (Docker Publish is a 9-job matrix).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vision-agent
            dockerfile: services/vision-agent/Dockerfile
          - service: graphdb-agent
            dockerfile: services/graphdb-agent/Dockerfile
          - service: nutrition-agent
            dockerfile: services/nutrition-agent/Dockerfile
          - service: rag-agent
            dockerfile: services/rag-agent/Dockerfile
          - service: text2sql-agent
            dockerfile: services/text2sql-agent/Dockerfile
          - service: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: user-portal
            dockerfile: apps/user-portal/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=http://localhost:3000
          - service: admin-portal
            dockerfile: apps/admin-portal/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=http://localhost:3000
          # One-shot job image used by docker-compose.prod.yml on the VM:
          # migrations, LangGraph checkpoint tables, seed, USDA import.
          - service: migrate
            dockerfile: docker/migrate.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Short git SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriagent-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriagent-${{ matrix.service }}:${{ steps.vars.outputs.short_sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nutriagent-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nutriagent-${{ matrix.service }}:buildcache,mode=max
