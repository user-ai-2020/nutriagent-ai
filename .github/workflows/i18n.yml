name: i18n

on:
  push:
    branches: [main, master]
  pull_request:

# Only the newest run per branch matters — cancel superseded ones instead of
# letting them queue and burn Actions minutes (Docker Publish is a 9-job matrix).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locale-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the test scripts pass quoted globs like "src/**/*.test.ts"
          # so the shell leaves them alone (sh has no globstar — `**` collapses to a
          # single level and silently skips top-level test files). Node's own glob
          # support in --test arrived in v21.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared (includes i18n key lint)
        run: pnpm --filter @nutriagent/shared build

      - name: Run i18n usage tests
        run: pnpm test:i18n

      - name: Lint i18n keys in apps
        run: pnpm lint:i18n
